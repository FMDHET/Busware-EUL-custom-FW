; PlatformIO Project Configuration
; Busware EUL22 - Custom Firmware
;
; Hardware:    Busware EUL22 (siehe schematics/EUL22.pdf)
; MCU:         ESP32-C3FH4  (RISC-V, 4 MB Flash, native USB)
; EnOcean:     TCM515 an UART0 (GPIO20 RX / GPIO21 TX @ 57600 8N1)
; Console/IO:  USB Serial/JTAG (native, GPIO18/19)
; Framework:   ESP-IDF

[platformio]
src_dir      = main
default_envs = busware-eul22

[env:busware-eul22]
platform     = espressif32@^6.13.0
framework    = espidf
board        = esp32-c3-devkitm-1

board_upload.flash_size = 4MB
board_build.flash_mode  = dio
board_build.partitions  = partitions.csv

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed    = 460800

; Flashen via native USB (ROM DFU / USB Serial-JTAG des ESP32-C3):
; Falls VS Code den Port nicht selbst findet:
;   upload_port  = /dev/tty.usbmodem*
;   monitor_port = /dev/tty.usbmodem*

build_flags =
    -DBUSWARE_EUL22

; Vor jedem Build: TypeScript-Portal (web/) -> main/portal_html.h regenerieren.
; Braucht Node.js + npm. Faellt sauber zurueck wenn nicht installiert.
extra_scripts =
    pre:scripts/prebuild_version.py
    pre:scripts/prebuild_web.py
